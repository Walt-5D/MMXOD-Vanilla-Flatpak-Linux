app-id: io.github.walt_5d.MMXOD
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: mmxod-wrapper

finish-args:
  # Graphics and windowing (X11 required for SFML)
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Multiplayer network access
  - --share=network
  # Audio support (PulseAudio and PipeWire)
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # Gamepad and controller support
  - --device=input
  # Required to inhibit screensaver via D-Bus in the wrapper script
  - --talk-name=org.freedesktop.ScreenSaver

modules:
  # The pre-compiled game binary requires legacy OpenSSL 1.1,
  # which is no longer provided by the Freedesktop 24.08 SDK.
  - name: openssl-1.1
    buildsystem: simple
    build-commands:
      - ./config --prefix=/app --openssldir=/app/etc/ssl shared
      - make -j$(nproc)
      - make install_sw
    sources:
      - type: archive
        url: https://www.openssl.org/source/openssl-1.1.1w.tar.gz
        sha256: cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8

  # Audio backend dependency
  - name: openal-soft
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://openal-soft.org/openal-releases/openal-soft-1.23.1.tar.bz2
        sha256: 796f4b89134c4e57270b7f0d755f0fa3435b90da437b745160a49bd41c845b21

  # Simple and Fast Multimedia Library (SFML) and C bindings (CSFML)
  # required by the game engine for rendering and window management.
  - name: sfml
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://www.sfml-dev.org/files/SFML-2.5.1-sources.zip
        sha256: bf1e0643acb92369b24572b703473af60bac82caf5af61e77c063b779471bb7f

  - name: csfml
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://www.sfml-dev.org/files/CSFML-2.5.1-sources.zip
        sha256: 5453f04ae782a22697ebeb2694a0f7a56bf172c1406ca2b9134143198705ddc7

  # Kerberos dependency (required by legacy networking setups)
  - name: krb5
    buildsystem: autotools
    subdir: src
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.21/krb5-1.21.2.tar.gz
        sha256: 9560941a9d843c0243a71b17a7ac6fe31c7cebb5bce3983db79e52ae7e850491

  # Main game module
  - name: mmxod
    buildsystem: simple
    build-commands:
      - install -d /app/bin
      - install -d /app/share/mmxod
      - install -Dm755 mmxod-wrapper /app/bin/mmxod-wrapper
      - install -Dm644 io.github.walt_5d.MMXOD.desktop /app/share/applications/io.github.walt_5d.MMXOD.desktop
      - install -Dm644 io.github.walt_5d.MMXOD.png /app/share/icons/hicolor/512x512/apps/io.github.walt_5d.MMXOD.png
      - install -Dm644 io.github.walt_5d.MMXOD.metainfo.xml /app/share/metainfo/io.github.walt_5d.MMXOD.metainfo.xml
      - install -Dm755 apply_extra /app/bin/apply_extra
      
    sources:
      - type: extra-data
        url: https://github.com/gamemaker19/MMXOnline/releases/download/v19.12/MMXOnlineV19_12_debian_x64_sc.zip
        sha256: 8d0ed96a35f877bdc8d1977a63e5fe185079ed3b747d896a7c46c97b0794e6e5
        size: 30510486
        filename: debian_game.zip

      - type: extra-data
        url: https://github.com/gamemaker19/MMXOnline/releases/download/v19.12/MMXOnlineV19_12_win_x86_sc.zip
        sha256: 6774ad22eeab01b9867b482177df52eba9c5f66b451fbe4be2cc536f381eee63
        size: 151183330
        filename: win_game.zip

      - type: file
        path: mmxod-wrapper
      - type: file
        path: io.github.walt_5d.MMXOD.desktop
      - type: file
        path: io.github.walt_5d.MMXOD.png
      - type: file
        path: io.github.walt_5d.MMXOD.metainfo.xml
      - type: file
        path: apply_extra
